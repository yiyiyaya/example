apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-app-deployment
spec:
  replicas: 2 # 启动 2 个副本
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: go-app
    spec:
      containers:
      - name: go-app
        image: my-go-app:v1 # 你的镜像名
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: go-app-service
spec:
  type: NodePort # 暴露出端口让电脑能访问
  selector:
    app: go-app # 流量转发给标签为 app: go-app 的 Deployment
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080 # 宿主机直接访问这个端口